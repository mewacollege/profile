<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" role="img" aria-label="K.R. Sai Varun — Full-Stack Developer and AI Application Builder. Terminal-style hero banner, light theme.">
  <defs>
    <!-- Background gradients -->
    <radialGradient id="l_bgGlow1" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="l_bgGlow2" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l_frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#6D28D9" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="l_panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="l_accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#6D28D9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l_scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="l_highlightSweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="45%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.08"/>
      <stop offset="55%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 -1; 1 1" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="l_grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#CBD5E1" stroke-width="0.5" stroke-opacity="0.45"/>
    </pattern>
    <pattern id="l_scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#0891B2" opacity="0.025"/>
    </pattern>
    <filter id="l_softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="l_outerClip">
      <rect x="0" y="0" width="1180" height="610" rx="22" ry="22"/>
    </clipPath>
    <clipPath id="l_scanReveal">
      <rect x="60" y="150" width="360" height="0">
        <animate attributeName="height" from="0" to="340" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.22 1 0.36 1" keyTimes="0;1"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#l_outerClip)">
    <rect width="1180" height="610" fill="#FFFFFF"/>
    <rect width="1180" height="610" fill="url(#l_bgGlow1)"/>
    <rect width="1180" height="610" fill="url(#l_bgGlow2)"/>
    <rect width="1180" height="610" fill="url(#l_grid)"/>
    <rect width="1180" height="610" fill="url(#l_scanlines)"/>

    <!-- Drifting particles -->
    <circle cx="100" cy="500" r="1.2" fill="#0891B2" opacity="0">
      <animate attributeName="opacity" values="0;0.25;0" dur="18s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 12 -8; 0 0" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="120" r="1.2" fill="#6D28D9" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" dur="22s" begin="4s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; -10 6; 0 0" dur="22s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="480" r="1" fill="#047857" opacity="0">
      <animate attributeName="opacity" values="0;0.2;0" dur="20s" begin="8s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 8 -10; 0 0" dur="20s" begin="8s" repeatCount="indefinite"/>
    </circle>

    <!-- Outer frame -->
    <rect x="14" y="14" width="1152" height="582" rx="20" ry="20" fill="none" stroke="url(#l_frameStroke)" stroke-width="1.2"/>
    <rect x="20" y="20" width="1140" height="570" rx="16" ry="16" fill="none" stroke="#E2E8F0" stroke-width="0.6"/>

    <!-- Terminal header bar -->
    <rect x="20" y="20" width="1140" height="40" rx="16" ry="16" fill="#F1F5F9"/>
    <rect x="20" y="44" width="1140" height="16" fill="#F1F5F9"/>
    <circle cx="46" cy="40" r="5.5" fill="#EF4444"/>
    <circle cx="66" cy="40" r="5.5" fill="#F59E0B"/>
    <circle cx="86" cy="40" r="5.5" fill="#10B981"/>
    <text x="112" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#475569">sai@github: ~ /profile</text>
    <text x="1120" y="45" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#0891B2" letter-spacing="2">[ PROFILE ]</text>
    <line x1="20" y1="60" x2="1160" y2="60" stroke="#E2E8F0" stroke-width="0.8"/>

    <!-- ============ LEFT COLUMN — VISUAL.IDENTITY ============ -->
    <rect x="60" y="100" width="360" height="420" rx="14" ry="14" fill="url(#l_panelFill)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="60" y="100" width="360" height="420" rx="14" ry="14" fill="none" stroke="#0891B2" stroke-opacity="0.15" stroke-width="1"/>

    <text x="80" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#0891B2" letter-spacing="2">VISUAL.IDENTITY</text>
    <line x1="80" y1="136" x2="400" y2="136" stroke="#E2E8F0" stroke-width="0.6"/>

    <!-- ASCII Portrait -->
    <g clip-path="url(#l_scanReveal)">
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9" fill="#0891B2" opacity="0.9">
        <text x="80" y="162" letter-spacing="3.5">      ..::;;+*#%%%#*+;::..</text>
        <text x="80" y="174" letter-spacing="3.5">    .:+*#%%%%%%%%%%%%%#*+:.</text>
        <text x="80" y="186" letter-spacing="3.5">  .:+##%%%%%%%%%%%%%%%%%%%%##+:.</text>
        <text x="80" y="198" letter-spacing="3.5"> .:+##%%%%%%%%%%%%%%%%%%%%%%%%##+:.</text>
        <text x="80" y="210" letter-spacing="3.5"> :+##%%%%%%%%%%%%%%%%%%%%%%%%%%%%##+:</text>
        <text x="80" y="222" letter-spacing="3.5">+##%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%##+</text>
        <text x="80" y="234" letter-spacing="3.5">##%%%%%#*+;:.....::;+*#%%%%%%%%%%%%%%%##</text>
        <text x="80" y="246" letter-spacing="3.5">##%%%*:...............:*%%%%%%%%%%%%%%%##</text>
        <text x="80" y="258" letter-spacing="3.5">##%#:....................:#%%%%%%%%%%%%%##</text>
        <text x="80" y="270" letter-spacing="3.5">##%:.......................:%%%%%%%%%%%%%##</text>
        <text x="80" y="282" letter-spacing="3.5">##%:..:+#*:.......:*#+:...:%%%%%%%%%%%%%##</text>
        <text x="80" y="294" letter-spacing="3.5">##%:..:*#%*:.....:*#%*:...:%%%%%%%%%%%%%##</text>
        <text x="80" y="306" letter-spacing="3.5">##%:.....:.........:.....:%=============%%#</text>
        <text x="80" y="318" letter-spacing="3.5">##%%:...................:%%%%%%%%%%%%%%%##</text>
        <text x="80" y="330" letter-spacing="3.5">##%%%:.................:%%%%%%%%%%%%%%%%%%##</text>
        <text x="80" y="342" letter-spacing="3.5">##%%%%%*:...........:*%%%%%%%%%%%%%%%%%%%%##</text>
        <text x="80" y="354" letter-spacing="3.5">##%%%%%%%%#*+;:...:;+*#%%%%%%%%%%%%%%%%%%%%##</text>
        <text x="80" y="366" letter-spacing="3.5">##%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%##</text>
        <text x="80" y="378" letter-spacing="3.5">##%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%##</text>
        <text x="80" y="390" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
        <text x="80" y="402" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
        <text x="80" y="414" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
        <text x="80" y="426" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
        <text x="80" y="438" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
        <text x="80" y="450" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
        <text x="80" y="462" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
        <text x="80" y="474" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
        <text x="80" y="486" letter-spacing="3.5">#%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%#</text>
      </g>
      <rect x="60" y="150" width="360" height="340" fill="url(#l_highlightSweep)" opacity="0.5"/>
    </g>

    <!-- Scanline sweep -->
    <rect x="60" y="100" width="360" height="6" fill="url(#l_scanGrad)" opacity="0">
      <animate attributeName="y" values="100; 520" dur="6s" begin="2s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1" keyTimes="0;1"/>
      <animate attributeName="opacity" values="0; 0.3; 0.3; 0" dur="6s" begin="2s" repeatCount="indefinite" keyTimes="0;0.1;0.8;1"/>
    </rect>

    <!-- Terminal command under portrait -->
    <text x="80" y="510" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#475569">
      <tspan fill="#047857">sai@github</tspan><tspan fill="#94A3B8">:</tspan><tspan fill="#0891B2">~</tspan><tspan fill="#94A3B8">$ </tspan><tspan fill="#0F172A">whoami</tspan>
    </text>
    <text x="80" y="526" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#0891B2" font-weight="700">K.R. SAI VARUN</text>

    <!-- ============ RIGHT COLUMN — SYSTEM.INFO ============ -->
    <rect x="450" y="100" width="670" height="420" rx="14" ry="14" fill="url(#l_panelFill)" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="450" y="100" width="670" height="420" rx="14" ry="14" fill="none" stroke="#0891B2" stroke-opacity="0.15" stroke-width="1"/>

    <text x="472" y="126" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#0891B2" letter-spacing="2">SYSTEM.INFO</text>
    <text x="1098" y="126" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#047857">● ONLINE</text>
    <circle cx="1088" cy="122" r="3.5" fill="#047857">
      <animate attributeName="r" values="3.5; 5; 3.5" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1" keyTimes="0;0.5;1"/>
      <animate attributeName="opacity" values="1; 0.6; 1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <line x1="472" y1="136" x2="1098" y2="136" stroke="#E2E8F0" stroke-width="0.6"/>

    <!-- Name -->
    <text x="472" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" fill="#0F172A" font-weight="700" letter-spacing="1">K.R. Sai Varun</text>
    <text x="472" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" fill="#0891B2" letter-spacing="0.5">Full-Stack Developer · AI Application Builder</text>

    <line x1="472" y1="212" x2="1098" y2="212" stroke="#E2E8F0" stroke-width="0.6"/>

    <!-- SYSTEM.INFO rows -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
      <text x="472" y="240" fill="#94A3B8">&gt; ROLE</text>
      <text x="600" y="240" fill="#0F172A">Full-Stack Developer</text>

      <text x="472" y="266" fill="#94A3B8">&gt; FOCUS</text>
      <text x="600" y="266" fill="#0F172A">Backend · Web · AI / Data</text>

      <text x="472" y="292" fill="#94A3B8">&gt; STACK</text>
      <text x="600" y="292" fill="#0F172A">Python · Django · React · SQL</text>

      <text x="472" y="318" fill="#94A3B8">&gt; BUILDING</text>
      <text x="600" y="318" fill="#0F172A">Full-stack &amp; AI-powered applications</text>

      <text x="472" y="344" fill="#94A3B8">&gt; LEARNING</text>
      <text x="600" y="344" fill="#0F172A">TypeScript · AWS · Docker · GraphQL</text>

      <text x="472" y="370" fill="#94A3B8">&gt; EDUCATION</text>
      <text x="600" y="370" fill="#0F172A">MCA (Pursuing) · BCA Graduate</text>

      <text x="472" y="396" fill="#94A3B8">&gt; LOCATION</text>
      <text x="600" y="396" fill="#0F172A">Bengaluru, India</text>

      <text x="472" y="422" fill="#94A3B8">&gt; CONTACT</text>
      <text x="600" y="422" fill="#0891B2">krsaivarun@gmail.com</text>
    </g>

    <!-- Stack pills -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10">
      <rect x="472" y="446" width="72" height="22" rx="11" fill="#F1F5F9" stroke="#0891B2" stroke-opacity="0.4" stroke-width="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1; 0 0; 0 1; 0 0" dur="4s" repeatCount="indefinite"/>
      </rect>
      <text x="508" y="461" text-anchor="middle" fill="#0891B2">Python</text>

      <rect x="552" y="446" width="68" height="22" rx="11" fill="#F1F5F9" stroke="#047857" stroke-opacity="0.4" stroke-width="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1; 0 0; 0 1; 0 0" dur="4.4s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <text x="586" y="461" text-anchor="middle" fill="#047857">Django</text>

      <rect x="628" y="446" width="62" height="22" rx="11" fill="#F1F5F9" stroke="#6D28D9" stroke-opacity="0.4" stroke-width="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1; 0 0; 0 1; 0 0" dur="4.8s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <text x="659" y="461" text-anchor="middle" fill="#6D28D9">React</text>

      <rect x="698" y="446" width="52" height="22" rx="11" fill="#F1F5F9" stroke="#B45309" stroke-opacity="0.4" stroke-width="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1; 0 0; 0 1; 0 0" dur="5.2s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <text x="724" y="461" text-anchor="middle" fill="#B45309">SQL</text>

      <rect x="758" y="446" width="62" height="22" rx="11" fill="#F1F5F9" stroke="#0891B2" stroke-opacity="0.4" stroke-width="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1; 0 0; 0 1; 0 0" dur="5.6s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <text x="789" y="461" text-anchor="middle" fill="#0891B2">Flask</text>

      <rect x="828" y="446" width="82" height="22" rx="11" fill="#F1F5F9" stroke="#047857" stroke-opacity="0.4" stroke-width="0.8">
        <animateTransform attributeName="transform" type="translate" values="0 0; 0 -1; 0 0; 0 1; 0 0" dur="6s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <text x="869" y="461" text-anchor="middle" fill="#047857">REST APIs</text>
    </g>

    <!-- Currently building -->
    <text x="472" y="496" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#94A3B8" letter-spacing="2">CURRENTLY BUILDING</text>
    <text x="472" y="514" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#0F172A">Full-stack applications · AI-powered tools</text>

    <!-- Footer -->
    <line x1="60" y1="548" x2="1120" y2="548" stroke="#E2E8F0" stroke-width="0.6"/>
    <text x="60" y="570" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#475569">
      <tspan fill="#047857">sai@github</tspan><tspan>:</tspan><tspan fill="#0891B2">~</tspan><tspan>$ </tspan><tspan fill="#0F172A">echo "Thanks for visiting."</tspan>
    </text>
    <text x="1120" y="570" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#94A3B8">github.com/KRSaiVarun</text>
  </g>
</svg>
