<!-- NEW ENHANCEMENT DEFS -->
<!-- Scanning laser gradient -->
<linearGradient id="scanBeamGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#0af0ff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#0af0ff" stop-opacity="0.25"/>
  <stop offset="95%" stop-color="#7ff5ff" stop-opacity="0.9"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="1"/>
</linearGradient>

<!-- Shimmer reflection gradient -->
<linearGradient id="hologramShimmer" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0af0ff" stop-opacity="0"/>
  <stop offset="45%" stop-color="#0af0ff" stop-opacity="0.03"/>
  <stop offset="50%" stop-color="#7ff5ff" stop-opacity="0.15"/>
  <stop offset="55%" stop-color="#0af0ff" stop-opacity="0.03"/>
  <stop offset="100%" stop-color="#0af0ff" stop-opacity="0"/>
</linearGradient>

<!-- Header laser beam gradient -->
<linearGradient id="hdrSweepGrad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#0af0ff" stop-opacity="0"/>
  <stop offset="50%" stop-color="#7ff5ff" stop-opacity="0.8"/>
  <stop offset="100%" stop-color="#0af0ff" stop-opacity="0"/>
</linearGradient>

<!-- Radar sweep radial arc gradient -->
<radialGradient id="radarSweepGrad" cx="50%" cy="50%" r="50%">
  <stop offset="80%" stop-color="#0af0ff" stop-opacity="0"/>
  <stop offset="98%" stop-color="#7ff5ff" stop-opacity="0.4"/>
  <stop offset="100%" stop-color="#0af0ff" stop-opacity="0"/>
</radialGradient>

<style>
  /* --- KEYFRAME ANIMATIONS --- */
  @keyframes hudPulse {
    0%, 100% { opacity: 0.9; filter: drop-shadow(0 0 2px #0af0ff); }
    50% { opacity: 1; filter: drop-shadow(0 0 7px #7ff5ff); }
  }
  @keyframes headerScan {
    0% { transform: translateX(-400px); opacity: 0; }
    20% { opacity: 0.9; }
    80% { opacity: 0.9; }
    100% { transform: translateX(1600px); opacity: 0; }
  }
  @keyframes faceScanLoop {
    0% { transform: translateY(-30px); opacity: 0; }
    10% { opacity: 0.85; }
    85% { opacity: 0.85; }
    100% { transform: translateY(500px); opacity: 0; }
  }
  @keyframes shimmerMove {
    0% { transform: translate(-300px, -300px); }
    100% { transform: translate(300px, 300px); }
  }
  @keyframes rotateCW {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes rotateCCW {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  @keyframes glowBreath {
    0%, 100% { opacity: 0.55; transform: scale(1); }
    50% { opacity: 0.95; transform: scale(1.025); }
  }
  @keyframes gridDrift {
    0% { transform: translateY(0px); }
    100% { transform: translateY(40px); }
  }
  @keyframes flickerText {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.45; }
    94% { opacity: 1; }
    97% { opacity: 0.8; }
    98% { opacity: 0.3; }
    99% { opacity: 1; }
  }
  @keyframes blinkStatus {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes particleFloat1 {
    0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    50% { transform: translateY(-45px) translateX(15px); opacity: 0.75; }
    100% { transform: translateY(-90px) translateX(0px); opacity: 0.2; }
  }
  @keyframes particleFloat2 {
    0% { transform: translateY(0px) translateX(0px); opacity: 0.15; }
    50% { transform: translateY(55px) translateX(-20px); opacity: 0.65; }
    100% { transform: translateY(110px) translateX(0px); opacity: 0.15; }
  }
  @keyframes targetBrackets {
    0%, 100% { transform: scale(1); opacity: 0.75; }
    50% { transform: scale(1.015); opacity: 1; filter: drop-shadow(0 0 4px #0af0ff); }
  }
  @keyframes globePulse {
    0%, 100% { opacity: 0.65; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.03); filter: drop-shadow(0 0 5px #0af0ff); }
  }
  @keyframes borderGlowPulse {
    0%, 100% { stroke-opacity: 0.4; }
    50% { stroke-opacity: 0.85; filter: drop-shadow(0 0 3px #12aebe); }
  }
  @keyframes textShimmerGlow {
    0%, 100% { opacity: 0.75; }
    50% { opacity: 1; filter: drop-shadow(0 0 3px #7ff5ff); }
  }

  /* Bar visualizer rhythm animation */
  @keyframes bar1 { 0%, 100% { y2: 730; } 50% { y2: 690; } }
  @keyframes bar2 { 0%, 100% { y2: 710; } 50% { y2: 745; } }
  @keyframes bar3 { 0%, 100% { y2: 740; } 50% { y2: 685; } }
  @keyframes bar4 { 0%, 100% { y2: 700; } 50% { y2: 735; } }
  @keyframes bar5 { 0%, 100% { y2: 725; } 50% { y2: 675; } }
  @keyframes bar6 { 0%, 100% { y2: 690; } 50% { y2: 740; } }
  @keyframes bar7 { 0%, 100% { y2: 715; } 50% { y2: 670; } }
  @keyframes bar8 { 0%, 100% { y2: 675; } 50% { y2: 720; } }

  /* Class assignment */
  .anim-glow-breath {
    transform-origin: 480px 450px;
    animation: glowBreath 6s ease-in-out infinite;
  }
  .anim-flicker-title {
    animation: flickerText 7s infinite, hudPulse 3s ease-in-out infinite;
  }
  .anim-radar-cw {
    transform-origin: 480px 450px;
    animation: rotateCW 10s linear infinite;
  }
  .anim-radar-ccw {
    transform-origin: 480px 450px;
    animation: rotateCCW 16s linear infinite;
  }
  .anim-corners {
    transform-origin: 480px 450px;
    animation: targetBrackets 3.5s ease-in-out infinite;
  }
  .anim-blink {
    animation: blinkStatus 1.8s steps(2, start) infinite;
  }
  .anim-blink-fast {
    animation: blinkStatus 0.9s steps(2, start) infinite;
  }
  .anim-header-sweep {
    animation: headerScan 5.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  .anim-face-scan {
    animation: faceScanLoop 4s ease-in-out infinite;
  }
  .anim-holo-shimmer {
    animation: shimmerMove 6s linear infinite;
  }
  .anim-globe {
    transform-origin: 95px 500px;
    animation: globePulse 4s ease-in-out infinite;
  }
  .anim-border-pulse {
    animation: borderGlowPulse 4s ease-in-out infinite;
  }
  .anim-text-pulse {
    animation: textShimmerGlow 3s ease-in-out infinite;
  }

  /* Equalizer bars */
  .vbar-1 { animation: bar1 1.2s ease-in-out infinite; }
  .vbar-2 { animation: bar2 0.9s ease-in-out infinite; }
  .vbar-3 { animation: bar3 1.4s ease-in-out infinite; }
  .vbar-4 { animation: bar4 1.1s ease-in-out infinite; }
  .vbar-5 { animation: bar5 1.5s ease-in-out infinite; }
  .vbar-6 { animation: bar6 0.8s ease-in-out infinite; }
  .vbar-7 { animation: bar7 1.3s ease-in-out infinite; }
  .vbar-8 { animation: bar8 1.0s ease-in-out infinite; }

  .p-float-1 { animation: particleFloat1 7s ease-in-out infinite; }
  .p-float-2 { animation: particleFloat2 8.5s ease-in-out infinite; }

  /* Reduced motion preferences */
  @media (prefers-reduced-motion: reduce) {
    *, .anim-radar-cw, .anim-radar-ccw, .anim-header-sweep, .anim-face-scan,
    .anim-flicker-title, .vbar-1, .vbar-2, .vbar-3, .vbar-4, .vbar-5, .vbar-6, .vbar-7, .vbar-8 {
      animation: none !important;
    }
  }
</style>
